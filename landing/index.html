// ─── Number Counter Component ────────────────────────────────────────────────
function Counter({ end, suffix = "", prefix = "", duration = 1800 }) {
  const [val, setVal] = useState(0);
  const [started, setStarted] = useState(false);
  const ref = useRef(null);

  useEffect(() => {
    const obs = new IntersectionObserver(
      ([e]) => { if (e.isIntersecting) { setStarted(true); obs.disconnect(); } },
      { threshold: 0.3 }
    );
    if (ref.current) obs.observe(ref.current);
    return () => obs.disconnect();
  }, []);

  useEffect(() => {
    if (!started) return;
    let start = null;
    const step = (ts) => {
      if (!start) start = ts;
      const p = Math.min((ts - start) / duration, 1);
      setVal(Math.floor(p * end));
      if (p < 1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  }, [started, end, duration]);

  return <span ref={ref}>{prefix}{val.toLocaleString()}{suffix}</span>;
}

// ─── FAQ Item Component ───────────────────────────────────────────────────────
function FaqItem({ q, a, category }) {
  const [open, setOpen] = useState(false);
  return (
    <div style={{ borderBottom: "1px solid rgba(255,255,255,0.08)", overflow: "hidden" }}>
      <button
        onClick={() => setOpen(!open)}
        style={{ width: "100%", padding: "20px 0", display: "flex", justifyContent: "space-between", alignItems: "flex-start", textAlign: "left", background: "none", border: "none", color: "#fff", cursor: "pointer", gap: 16 }}
      >
        <div style={{ display: "flex", flexDirection: "column", gap: 4 }}>
          {category && <span style={{ fontSize: 11, fontWeight: 700, color: "#10b981", letterSpacing: "0.05em", textTransform: "uppercase" }}>{category}</span>}
          <span style={{ fontSize: 15, fontWeight: 600, lineHeight: 1.4, color: open ? "#a5b4fc" : "#f1f5f9" }}>{q}</span>
        </div>
        <span style={{ fontSize: 20, color: open ? "#a5b4fc" : "rgba(255,255,255,0.3)", transform: open ? "rotate(45deg)" : "none", transition: "transform 0.2s, color 0.2s", flexShrink: 0, marginTop: 2 }}>+</span>
      </button>
      {open && (
        <div style={{ paddingBottom: 22, color: "rgba(255,255,255,0.65)", fontSize: 13.5, lineHeight: 1.7 }}>
          {a}
        </div>
      )}
    </div>
  );
}

                      <p style={{ fontSize: 11.5, color: "rgba(255,255,255,0.45)", margin: 0, lineHeight: 1.5 }}>{item.desc}</p>
                    </div>
                    <div style={{ fontSize: 11, color: "#10b981", fontWeight: 600, marginTop: 12, display: "flex", alignItems: "center", gap: 4 }}>
                      <span>Click to enlarge</span> →
                    </div>
                  </div>
                </div>
              ))}
          </div>
        </div>
      </section>

      {/* ── ARCHITECTURE PIPELINE ── */}
      <section id="architecture" style={{ position: "relative", zIndex: 1, padding: "80px 24px", background: "rgba(255,255,255,0.01)" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 50 }}>
            <div style={{ fontSize: 12, letterSpacing: "0.12em", color: "#06b6d4", marginBottom: 12, fontWeight: 700 }}>SYSTEM TOPOLOGY</div>
            <h2 style={{ fontSize: "clamp(1.8rem, 3.2vw, 2.6rem)", fontWeight: 900, letterSpacing: "-0.03em" }}>
              End-to-End Orchestration Architecture
            </h2>
            <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 14, maxWidth: 640, margin: "10px auto 0" }}>
              How RECLAIM intercepts, evaluates, and recovers transactions in under 120ms.
            </p>
          </div>

          <div style={{ display: "grid", gridTemplateColumns: "repeat(auto-fit, minmax(180px, 1fr))", gap: 14 }}>
            {[
              { num: "01", title: "Razorpay Webhook", tech: "HMAC-SHA256", desc: "Listens to payment.failed with raw error description & bank telemetry." },
              { num: "02", title: "Risk Synthesis", tech: "Signal Engine", desc: "Constructs customer tenure, past success rate, and bank uptime index." },
              { num: "03", title: "Nemotron AI", tech: "Llama-3.1-70B", desc: "Infers root cause and generates recovery strategy + Hinglish messaging." },
              { num: "04", title: "Policy Guardrails", tech: "Deterministic v152", desc: "Checks 6 strict invariants: retry limit, interval, spam cap, fraud bounds." },
              { num: "05", title: "Idempotent Exec", tech: "Razorpay Test Gateway", desc: "Executes automated retry or sends UPI payment link with idempotency keys." },
              { num: "06", title: "Immutable Ledger", tech: "PostgreSQL & Audit", desc: "Cryptographically logs every state transition for 100% compliance." }
            ].map(step => (
              <div key={step.num} style={{ padding: "22px 18px", borderRadius: 14, background: "rgba(255,255,255,0.025)", border: "1px solid rgba(255,255,255,0.08)" }}>
                <div style={{ fontSize: 12, fontWeight: 900, color: "#10b981", marginBottom: 8 }}>{step.num}</div>
                <div style={{ fontSize: 14, fontWeight: 700, marginBottom: 4, color: "#f8fafc" }}>{step.title}</div>
                <div style={{ fontSize: 10.5, fontWeight: 600, color: "#a5b4fc", marginBottom: 8, fontFamily: "monospace" }}>{step.tech}</div>
                <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.45)", lineHeight: 1.5 }}>{step.desc}</div>
              </div>
            ))}
          </div>
        </div>
      </section>

      {/* ── EVALUATION LAB EVIDENCE ── */}
      <section id="eval" style={{ position: "relative", zIndex: 1, padding: "80px 24px" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ borderRadius: 20, border: "1px solid rgba(16,185,129,0.3)", background: "rgba(16,185,129,0.03)", overflow: "hidden" }}>
            <div style={{ padding: "36px 40px 28px" }}>
              <div style={{ display: "flex", alignItems: "flex-start", justifyContent: "space-between", flexWrap: "wrap", gap: 20 }}>
                <div>
                  <div style={{ fontSize: 11, letterSpacing: "0.1em", color: "#10b981", marginBottom: 8, fontWeight: 700 }}>EVALUATION LAB — 150 HELD-OUT CASES</div>
                  <h3 style={{ fontSize: "clamp(1.5rem,2.5vw,2rem)", fontWeight: 900, letterSpacing: "-0.02em" }}>
                    +₹3,34,300 Revenue Uplift vs Naive Baseline
                  </h3>
                  <p style={{ color: "rgba(255,255,255,0.5)", fontSize: 13.5, marginTop: 8, maxWidth: 640 }}>
                    Nemotron-assisted recovery achieved 84.4% win rate compared to 77.8% for naive retry mechanisms on identical policy bounds with zero hallucination.
                  </p>
                </div>
                <div style={{ display: "flex", gap: 28, flexShrink: 0 }}>
                  {[["100%", "Policy Invariants"], ["100%", "Audit Coverage"], ["84.4%", "Recovery Rate"]].map(([val, label]) => (
                    <div key={label} style={{ textAlign: "center" }}>
                      <div style={{ fontSize: "1.7rem", fontWeight: 900, color: "#10b981" }}>{val}</div>
                      <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)" }}>{label}</div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
            <img
              src={IMGS.eval}
              alt="Evaluation Lab Evidence"
              onClick={() => setLightboxImg({ src: IMGS.eval, title: "Evaluation Lab & Measurement Evidence" })}
              style={{ width: "100%", display: "block", borderTop: "1px solid rgba(255,255,255,0.08)", cursor: "zoom-in" }}
            />
          </div>
        </div>
      </section>

      {/* ── API REFERENCE SANDBOX ── */}
      <section id="api" style={{ position: "relative", zIndex: 1, padding: "80px 24px" }}>
        <div style={{ maxWidth: 940, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 40 }}>
            <div style={{ fontSize: 12, letterSpacing: "0.12em", color: "#818cf8", marginBottom: 12, fontWeight: 700 }}>DEVELOPER API</div>
            <h2 style={{ fontSize: "clamp(1.8rem, 3vw, 2.5rem)", fontWeight: 900, letterSpacing: "-0.03em" }}>RESTful. Idempotent. Observable.</h2>
          </div>
          <div style={{ display: "flex", gap: 6, padding: 4, background: "rgba(255,255,255,0.04)", borderRadius: 10, marginBottom: 16 }}>
            {CODE_TABS.map((t, i) => (
              <button key={t.label} onClick={() => setActiveTab(i)}
                style={{
                  flex: 1, padding: "9px 12px", fontSize: 12, fontWeight: 600, borderRadius: 7, border: "none", cursor: "pointer",
                  background: activeTab === i ? "rgba(99,102,241,0.25)" : "transparent",
                  color: activeTab === i ? "#c7d2fe" : "rgba(255,255,255,0.45)",
                  transition: "all 0.2s"
                }}>
                {t.label}
              </button>
            ))}
          </div>
          <div style={{ borderRadius: 14, overflow: "hidden", border: "1px solid rgba(255,255,255,0.1)", background: "#0a0f1a" }}>
            <div style={{ padding: "10px 18px", borderBottom: "1px solid rgba(255,255,255,0.06)", background: "rgba(255,255,255,0.02)", display: "flex", alignItems: "center", gap: 8 }}>
              <span style={{ fontSize: 10, padding: "2px 8px", borderRadius: 4, background: "rgba(16,185,129,0.15)", color: "#10b981", fontWeight: 700 }}>POST</span>
              <span style={{ fontSize: 11, color: "rgba(255,255,255,0.45)", fontFamily: "monospace" }}>{CODE_TABS[activeTab].lang}</span>
            </div>
            <pre style={{ padding: 24, margin: 0, fontSize: 12, lineHeight: 1.7, color: "#a8c1e0", overflowX: "auto", fontFamily: "'JetBrains Mono', 'Fira Code', monospace" }}>
              {CODE_TABS[activeTab].code}
            </pre>
          </div>
        </div>
      </section>

      {/* ── FAQ SECTION ── */}
      <section id="faq" style={{ position: "relative", zIndex: 1, padding: "80px 24px" }}>
        <div style={{ maxWidth: 800, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 48 }}>
            <div style={{ fontSize: 12, letterSpacing: "0.12em", color: "#10b981", marginBottom: 12, fontWeight: 700 }}>FREQUENTLY ASKED QUESTIONS</div>
            <h2 style={{ fontSize: "clamp(1.8rem, 3vw, 2.5rem)", fontWeight: 900, letterSpacing: "-0.03em" }}>Everything You Need to Know</h2>
          </div>
          {FAQS.map(f => <FaqItem key={f.q} {...f} />)}
        </div>
      </section>

      {/* ── FOOTER ── */}
      <footer style={{ position: "relative", zIndex: 1, padding: "70px 24px 36px", borderTop: "1px solid rgba(255,255,255,0.08)" }}>
        <div style={{ maxWidth: 1100, margin: "0 auto" }}>
          <div style={{ textAlign: "center", marginBottom: 50 }}>
            <h2 style={{ fontSize: "clamp(1.8rem, 3.2vw, 2.4rem)", fontWeight: 900, letterSpacing: "-0.03em", marginBottom: 16 }}>
              Stop losing revenue to involuntary payment failures.
            </h2>
            <div style={{ display: "flex", justifyContent: "center", gap: 14, flexWrap: "wrap" }}>
              <a href="https://github.com/Vishallakshmikanthan/Reclaim" target="_blank" rel="noopener"
                style={{ padding: "13px 32px", fontSize: 14, fontWeight: 700, borderRadius: 10, background: "linear-gradient(135deg, #10b981, #059669)", color: "#fff", textDecoration: "none", boxShadow: "0 0 35px rgba(16,185,129,0.3)" }}>
                ★ Star on GitHub
              </a>
              <button onClick={() => setVideoOpen(true)}
                style={{ padding: "13px 28px", fontSize: 14, fontWeight: 700, borderRadius: 10, background: "rgba(255,255,255,0.06)", border: "1px solid rgba(255,255,255,0.15)", color: "#fff", cursor: "pointer" }}>
                ▶ Watch Demo Video
              </button>
            </div>
          </div>

          <div style={{ display: "flex", justifyContent: "space-between", flexWrap: "wrap", gap: 24, paddingTop: 32, borderTop: "1px solid rgba(255,255,255,0.06)" }}>
            <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
              <img src={IMGS.logo} alt="RECLAIM" style={{ width: 32, height: 32, borderRadius: 8 }} />
              <div>
                <div style={{ fontWeight: 800, fontSize: 14 }}>RECLAIM</div>
                <div style={{ fontSize: 11, color: "rgba(255,255,255,0.4)" }}>Razorpay Buildathon 2026 Submission</div>
              </div>
            </div>
            <div style={{ display: "flex", gap: 24, flexWrap: "wrap", alignItems: "center" }}>
              <a href="https://github.com/Vishallakshmikanthan/Reclaim" target="_blank" rel="noopener" style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", textDecoration: "none" }}>GitHub Repository</a>
              <a href="https://drive.google.com/file/d/1sj5tLYPSE5pMs8J0sANO5E_NVBIsVvC7/view?usp=drive_link" target="_blank" rel="noopener" style={{ fontSize: 13, color: "rgba(255,255,255,0.5)", textDecoration: "none" }}>Demo Video</a>
              <span style={{ fontSize: 13, color: "rgba(255,255,255,0.3)" }}>Built with NVIDIA Nemotron × Razorpay</span>
            </div>
          </div>
        </div>
      </footer>

      {/* ── VIDEO MODAL ── */}
      {videoOpen && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.88)", backdropFilter: "blur(14px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setVideoOpen(false)}>
          <div style={{ width: "100%", maxWidth: 940, borderRadius: 16, overflow: "hidden", border: "1px solid rgba(255,255,255,0.15)", position: "relative", boxShadow: "0 25px 80px rgba(0,0,0,0.9)" }}
            onClick={e => e.stopPropagation()}>
            <div style={{ paddingBottom: "56.25%", position: "relative", height: 0 }}>
              <iframe
                src="https://drive.google.com/file/d/1sj5tLYPSE5pMs8J0sANO5E_NVBIsVvC7/preview"
                style={{ position: "absolute", top: 0, left: 0, width: "100%", height: "100%", border: "none" }}
                allow="autoplay"
                allowFullScreen
              />
            </div>
            <button onClick={() => setVideoOpen(false)}
              style={{ position: "absolute", top: 14, right: 14, width: 34, height: 34, borderRadius: "50%", background: "rgba(0,0,0,0.75)", border: "1px solid rgba(255,255,255,0.25)", color: "#fff", cursor: "pointer", fontSize: 16, display: "flex", alignItems: "center", justifyContent: "center" }}>
              ✕
            </button>
          </div>
        </div>
      )}

      {/* ── IMAGE LIGHTBOX MODAL ── */}
      {lightboxImg && (
        <div style={{ position: "fixed", inset: 0, zIndex: 200, background: "rgba(0,0,0,0.92)", backdropFilter: "blur(14px)", display: "flex", alignItems: "center", justifyContent: "center", padding: 24 }}
          onClick={() => setLightboxImg(null)}>
          <div style={{ width: "100%", maxWidth: 1100, maxHeight: "90vh", borderRadius: 16, overflow: "hidden", border: "1px solid rgba(255,255,255,0.18)", position: "relative", background: "#0a0e17" }}
            onClick={e => e.stopPropagation()}>
            <div style={{ padding: "14px 20px", borderBottom: "1px solid rgba(255,255,255,0.1)", display: "flex", alignItems: "center", justifyContent: "space-between" }}>
              <div>
                <div style={{ fontSize: 14, fontWeight: 700, color: "#fff" }}>{lightboxImg.title}</div>
                {lightboxImg.desc && <div style={{ fontSize: 11.5, color: "rgba(255,255,255,0.5)" }}>{lightboxImg.desc}</div>}
              </div>
              <button onClick={() => setLightboxImg(null)}
                style={{ width: 30, height: 30, borderRadius: "50%", background: "rgba(255,255,255,0.1)", border: "none", color: "#fff", cursor: "pointer", fontSize: 14, display: "flex", alignItems: "center", justifyContent: "center" }}>
                ✕
              </button>
            </div>
            <div style={{ padding: 12, overflowY: "auto", maxHeight: "calc(90vh - 60px)" }}>
              <img src={lightboxImg.src} alt={lightboxImg.title} style={{ width: "100%", height: "auto", borderRadius: 8, display: "block" }} />
            </div>
          </div>
        </div>
      )}

      <style>{`
        @keyframes float {
          0%, 100% { transform: translateY(0); }
          50% { transform: translateY(-8px); }
        }
        * { box-sizing: border-box; }
        body { margin: 0; background: #07090E; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #07090E; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 3px; }
      `}</style>
    </div>
  );
}

    ReactDOM.createRoot(document.getElementById('root')).render(<ReclaimLanding />);
  </script>
</body>
